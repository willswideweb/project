<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubblewrap</title>
   <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/mzv6h4C/Untitled1173-20231213155207.png">
  <style>
    body {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: flex-start;
      align-content: flex-start;
      height: 100vh;
      margin: 0;
      background-color: #b2b2b2;
    }

    .image-container {
      width: 32px; /* Width of the image */
      height: 32px; /* Height of the image */
      margin: 0%;
      overflow: hidden;
    }

    .image {
      width: 100%;
      height: 100%;
      cursor: default;
    }
  </style>
  <script>
    var audio = new Audio('https://willswideweb.github.io/project/files/pop.ogg');
    audio.preload = 'auto';
    audio.volume = 1.0;

    function playClickSound() {
      audio.play();
    }

function changeImage(img) {
  if (img.dataset.popped === "true") {
    return;
  }

  img.dataset.popped = "true";

  img.src = 'https://i.ibb.co/ngc6HNs/Untitled1173-20231213155229.png';

  playClickSound();

  // Disable further hovering/clicking
  img.onmouseenter = null;
  img.onclick = null;
}
  </script>
</head>
