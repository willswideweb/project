    body,

    .broken-cookie-text {
      color: #000000;
    }

    body {
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .fortune-cookie {
      display: inline-block;
      cursor: pointer;
    }

    .cookie-wrapper {
      position: relative;
      text-align: center;
    }

    .cookie-inner {
      width: 120px;
      height: 120px;
      background: url('https://willswideweb.github.io/project/files/cookie.PNG') no-repeat center center;
      background-size: cover;
      position: relative;
      display: inline-block;
      transition: opacity 0.5s ease;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Rip cookie */
    .cookie-inner.new-image {
      background: url('https://willswideweb.github.io/project/files/cookie-snap.PNG') no-repeat center center;
      background-size: cover;
    }

    .fortune-message {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #000;
      font-weight: bold;
    }

    .broken-cookie {
      display: none;
    }

    .broken-cookie-left,
    .broken-cookie-right {
      width: 0;
      height: 100%;
      background: url('https://willswideweb.github.io/project/files/cookie.PNG') no-repeat center center;
      background-size: cover;
      position: absolute;
      top: 0;
      transition: width 0.5s ease;
    }

    .broken-cookie-left {
      left: 0;
    }

    .broken-cookie-right {
      right: 0;
    }

    .broken-cookie-text {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: white;
      padding: 20px;
      color: #000000;
      font-weight: bold;
      z-index: 1;
